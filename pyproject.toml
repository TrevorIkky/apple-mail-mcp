[project]
name = "apple-mail-mcp"
version = "0.1.0"
description = "MCP server for reading Apple Mail on macOS: AppleScript by default, IMAP when you need speed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trevor Ikky" }]
keywords = ["mcp", "apple-mail", "macos", "email", "imap", "applescript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = ["mcp>=2.0.0"]

[project.urls]
Homepage = "https://github.com/TrevorIkky/apple-mail-mcp"
Issues = "https://github.com/TrevorIkky/apple-mail-mcp/issues"

[project.scripts]
apple-mail-mcp = "apple_mail_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_mail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
